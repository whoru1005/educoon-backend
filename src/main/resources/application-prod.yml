spring:
  config:
    activate:
      on-profile: prod

  datasource:

    url: jdbc:mysql://${RDS_ENDPOINT}:3306/educoondb?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile_nickname, profile_image, account_email
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "http://${SERVER_IP}:8080/login/oauth2/code/kakao"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

google:
  gemini:
    api:
      key: ${GEMINI_API_KEY}
      url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent"

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  access-token-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-token-expiration: ${JWT_REFRESH_EXPIRATION}