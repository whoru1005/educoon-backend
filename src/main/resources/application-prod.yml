spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # RDS 주소는 환경변수로 주입
    url: jdbc:mysql://${RDS_ENDPOINT}:3306/educoondb?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    username: ${RDS_USERNAME}
    password: ${RDS_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 초기 배포 시에는 update, 안정화되면 validate로 변경 권장
      ddl-auto: update
    show-sql: false # 서버 로그 절약을 위해 끔

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: profile_nickname, profile_image, account_email
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            # [중요] 배포 시에는 리다이렉트 주소가 서버 IP로 바뀌어야 함
            redirect-uri: "http://${SERVER_IP}:8080/login/oauth2/code/kakao"
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

google:
  gemini:
    api:
      key: ${GEMINI_API_KEY}
      url: "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent"

jwt:
  secret:
    key: ${JWT_SECRET_KEY}