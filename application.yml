# -----------------------------------------------------
# (공통) 메인 설정 (Git에 포함됨)
# -----------------------------------------------------
server:
  port: 8080

spring:
  # --- 프로필 관리 ---
  # secret, oauth, gemini 프로필을 활성화하여 해당 .yml 파일들을 로드합니다.
  profiles:
    include: secret, oauth, gemini

  # --- 데이터베이스 (공통) ---
  datasource:
    # URL은 공개되어도 괜찮지만, ID/PW는 application-secret.yml 에 있습니다.
    url: jdbc:mysql://localhost:3306/educoondb?serverTimezone=Asia/Seoul&useUnicode=true&characterEncoding=utf8
    driver-class-name: com.mysql.cj.jdbc.Driver

  # --- JPA 설정 ---
  jpa:
    hibernate:
      # DB 스키마(SQL)와 JPA 엔티티가 일치하는지 '검증'합니다. (개발 초기엔 create-drop)
      ddl-auto: create-drop
    properties:
      hibernate:
        # SQL 쿼리를 콘솔에 예쁘게 출력
        format_sql: true
        show_sql: true
    # (선택) Java의 카멜케이스(예: userId)를 DB의 스네이크케이스(예: user_id)로 자동 매핑
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect

# --- Swagger (Springdoc) 설정 ---
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html # 접속 경로
    operations-sorter: alpha # API 순서 정렬
    tags-sorter: alpha
